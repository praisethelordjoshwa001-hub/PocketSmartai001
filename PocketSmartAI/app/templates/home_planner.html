{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><p class="eyebrow">HOME INTERIOR</p><h1>Build your home plan</h1><p>Tell PocketSmart AI what you want and how much you want to spend.</p></div><form id="homeForm" class="planner-form"><div class="form-grid"><label>Total budget (₹)<input name="budget" type="number" min="1" step="100" required></label><label>City<input name="city" value="Chennai" required></label><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Industrial</option><option>Scandinavian</option></select></label><label>Rooms<input name="rooms" placeholder="Living Room, Bedroom, Kitchen"></label></div><label>Items and quantities<input name="items" placeholder="LED lights x2, fan x1, dining table x1"></label><button class="btn primary">Generate Home Plan</button></form><p id="formMessage" class="message"></p></div>{% endblock %}
