{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><p class="eyebrow">STYLE MATCHING</p><h1>Find jewelry for the occasion</h1><p>Upload an outfit image optionally. AI can use visible colors and style cues as part of the recommendation.</p></div><form id="jewelryForm" class="planner-form" enctype="multipart/form-data"><div class="form-grid"><label>Budget (₹)<input name="budget" type="number" min="1" step="100" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Birthday / Party" required></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option><option>Casual</option></select></label><label>Metal<select name="metal"><option>Any</option><option>Gold-tone</option><option>Silver-tone</option><option>Rose-gold</option></select></label><label>Outfit color<input name="outfit_color" placeholder="Optional"></label><label>Outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label></div><label>Notes<textarea name="notes" placeholder="Neckline, preferred size, other preferences..."></textarea></label><button class="btn primary">Generate Jewelry Plan</button></form><p id="formMessage" class="message"></p></div>{% endblock %}
