{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="form-page"><div class="page-head"><p class="eyebrow">EVENT PLANNING</p><h1>Plan your party</h1><p>Allocate your budget across food, venue and decoration.</p></div><form id="partyForm" class="planner-form"><div class="form-grid"><label>Total budget (₹)<input name="budget" type="number" min="1" step="100" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Event</option><option>Other</option></select></label><label>Venue<input name="venue" value="Home"></label><label>City<input name="city" value="Chennai"></label></div><label>Preferences<textarea name="preferences" placeholder="Vegetarian food, simple decoration, evening event..."></textarea></label><button class="btn primary">Generate Party Plan</button></form><p id="formMessage" class="message"></p></div>{% endblock %}
